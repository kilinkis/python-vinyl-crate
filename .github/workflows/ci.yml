name: Continuous Integration (CI)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # 1. Security & Secret Scanning (Gitleaks + Pip-Audit)
  # -------------------------------------------------------------
  security-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run Pip-Audit Dependency Vulnerability Scan
        run: |
          pip-audit --desc

  # -------------------------------------------------------------
  # 2. Backend Linting, Typecheck & Pytest Suite
  # -------------------------------------------------------------
  backend-test:
    name: Backend Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check app/ tests/
          ruff format --check app/ tests/

      - name: Run Mypy Static Type Checking
        run: |
          mypy app/

      - name: Run Pytest Test Suite with Coverage
        run: |
          pytest -v --cov=app --cov-report=term-missing tests/

  # -------------------------------------------------------------
  # 3. Frontend Typecheck & Build
  # -------------------------------------------------------------
  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Typecheck & Production Build
        run: npm run build
