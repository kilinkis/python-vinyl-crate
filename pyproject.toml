[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vinyl-crate-api"
version = "1.0.0"
description = "Audiophile vinyl collection management API built with FastAPI and SQLAlchemy"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# -------------------------------------------------------------
# Pytest & Test Coverage Configuration
# -------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

# -------------------------------------------------------------
# Ruff Linter & Formatter Configuration
# -------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes (syntax & unused imports/vars)
    "I",   # isort (clean alphabetical import ordering)
    "B",   # flake8-bugbear (common bug detection)
]
ignore = [
    "E501", # Line length handled by formatter
    "B008", # Allow FastAPI Depends() in endpoint function default arguments
    "E402", # Module level import not at top of file (used to load models before Base)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
