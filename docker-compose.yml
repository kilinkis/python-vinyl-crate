version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL Database Service
  # -------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: vinyl_crate_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vinyl_crate}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vinyl_crate}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vinyl_network

  # -------------------------------------------------------------
  # FastAPI Backend Service
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vinyl_crate_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROJECT_NAME: "Vinyl Crate API"
      API_V1_STR: "/api/v1"
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-vinyl_crate}"
      SECRET_KEY: ${SECRET_KEY:-supersecretdevelopmentkeychangeinproduction1234567890}
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    networks:
      - vinyl_network

  # -------------------------------------------------------------
  # React + Vite Frontend Service
  # -------------------------------------------------------------
  frontend:
    image: node:20-alpine
    container_name: vinyl_crate_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - vinyl_network

volumes:
  postgres_data:
    driver: local

networks:
  vinyl_network:
    driver: bridge
